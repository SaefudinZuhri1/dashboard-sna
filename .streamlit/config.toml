# Konfigurasi Streamlit Dashboard Telkom Group — Versi 2.0
# Warna dipertahankan mengikuti desain dashboard versi 1.38.

[theme]
base = "dark"
primaryColor = "#E53935"
backgroundColor = "#0D0D0D"
secondaryBackgroundColor = "#111111"
textColor = "#FFFFFF"
font = "sans serif"

[server]
maxUploadSize = 50
headless = false
enableStaticServing = false

[client]
showSidebarNavigation = false

[browser]
serverAddress = "localhost"
gatherUsageStats = false

# PENTING:
# Jangan menambahkan baris enableCORS = false.
