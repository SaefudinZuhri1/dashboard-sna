# .streamlit/config.toml
# Konfigurasi Streamlit Dashboard Telkom Group — Deployment Final
# Nilai visual dipertahankan dari baseline UI/UX yang telah dikunci.

[theme]
base = "light"
primaryColor = "#E53935"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F1F1F"
font = "sans serif"

[server]
maxUploadSize = 50
# Mode lokal: false agar `streamlit run app.py` dapat membuka browser.
# Streamlit Community Cloud dapat menimpa opsi server sesuai lingkungannya.
headless = false
showEmailPrompt = false
enableStaticServing = false

[client]
showSidebarNavigation = false
# Tampilkan pesan umum kepada pengguna; detail teknis tetap ditangani melalui log aplikasi.
showErrorDetails = "none"

[browser]
serverAddress = "localhost"
gatherUsageStats = false

# Jangan menambahkan enableCORS = false.
